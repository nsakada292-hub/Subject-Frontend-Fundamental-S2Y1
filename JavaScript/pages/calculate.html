<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caculate</title>
    <style>
        form{
            padding: 50px;

        }
    </style>
</head>
<body>

    <form action="">
        <label for="number 1">Number 1</label>
        <input type="number" id="num1"><br><br>

        <label for="number 2">Number 2</label>
        <input type="number" id="num2"><br><br>

        <label for="option">Option</label>
        <select name="" id="opt">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>

        <h3>Result: <span id="result"></span></h3>

        <input type="button" value="Caculate">
    </form>

    <script src="../script/function/calculate.js"></script>
