<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
         <!-- search productId -->
           <div class="w-[500px] mx-auto flex gap-5">
              <!--title, price, description, category, image  -->

              <label
                for="searchProId"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Searching product Id</label
              >
              <!-- input for title -->
              <input
                type="number"
                id="searchProId"
                name="searchProId"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
              />
               <!-- btn search -->
              <button onclick="searchProductId()" class="border rounded bg-blue-400 w-[120px]">Search</button>
            </div>



     <!-- form  -->
    <form class="px-4 md:px-8 max-w-3xl mx-auto py-12">
      <div class="space-y-12">
        <div class="border-b border-gray-900/10 pb-4">
          <h2
            class="text-base font-semibold leading-7 text-gray-900 text-2xl text-purple-500"
          >
            Create Product Form
          </h2>

          <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
            <!-- title -->
            <div class="sm:col-span-4">
              <!--title, price, description, category, image  -->

              <label
                for="title"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Title</label
              >
              <!-- input for title -->
              <input
                type="text"
                id="title"
                name="title"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
              />
            </div>
            <!-- description -->
            <div class="sm:col-span-4">
              <!--title, price, description, category, image  -->

              <label
                for="description"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Description</label
              >
              <!-- input for title -->
              <input
                type="text"
                id="description"
                name="description"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
              />
            </div>

            <!-- price -->
            <div class="sm:col-span-4">
              <!--title, price, description, category, image  -->

              <label
                for="price"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Price</label
              >
              <!-- input for price -->
              <input
                type="number"
                id="price"
                name="price"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
              />
            </div>

            <!-- category -->
            <div class="sm:col-span-4">
              <!--title, price, description, category, image  -->

              <label
                for="category"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Category</label
              >
              <!-- input for category -->
              <input
                type="text"
                id="category"
                name="category"
                class="block w-full rounded-md border-0 py-1.5 text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 placeholder:text-gray-400 focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6"
              />
            </div>
            

            <div class="col-span-full">
              <label
                for="image"
                class="block text-sm font-medium leading-6 text-gray-900"
                >Product Image</label
              >
              <div
                class="mt-2 flex justify-center rounded-lg border border-dashed border-gray-900/25 px-6 py-10"
              >
                <div class="text-center">
                  <svg
                    class="mx-auto h-12 w-12 text-gray-300"
                    viewBox="0 0 24 24"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M1.5 6a2.25 2.25 0 012.25-2.25h16.5A2.25 2.25 0 0122.5 6v12a2.25 2.25 0 01-2.25 2.25H3.75A2.25 2.25 0 011.5 18V6zM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0021 18v-1.94l-2.69-2.689a1.5 1.5 0 00-2.12 0l-.88.879.97.97a.75.75 0 11-1.06 1.06l-5.16-5.159a1.5 1.5 0 00-2.12 0L3 16.061zm10.125-7.81a1.125 1.125 0 112.25 0 1.125 1.125 0 01-2.25 0z"
                      clip-rule="evenodd"
                    />
                  </svg>
                  <div class="mt-4 flex text-sm leading-6 text-gray-600">
                    <label
                      for="file-upload"
                      class="relative cursor-pointer rounded-md bg-white font-semibold text-indigo-600 focus-within:outline-none focus-within:ring-2 focus-within:ring-indigo-600 focus-within:ring-offset-2 hover:text-indigo-500"
                    >
                      <span>Upload a file</span>
                      <input
                        id="image"
                        name="image"
                        type="file"
                      />
                    </label>
                    <p class="pl-1">or drag and drop</p>
                  </div>
                  <p class="text-xs leading-5 text-gray-600">
                    PNG, JPG, GIF up to 10MB
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="mt-6 flex items-center justify-end gap-x-6">
        <button
          type="button"
          class="text-sm font-semibold leading-6 text-gray-900"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600"
        >
          Save
        </button>
      </div>
    </form>


     <script>
    document.querySelector("form").addEventListener("submit", async(e) => {
      // all code will write logic here
      e.preventDefault();

      let titleInput = document.getElementById('title').value;
      let descriptionInput = document.getElementById('description').value;
      let priceInput = document.getElementById('price').value;
      let categoryInput = document.getElementById('category').value;
      let imageInput = document.getElementById('image').files[0];

      console.log(`==>ImageINput: ${imageInput}`);

      // upload file 
           console.log(`==>ImageINput: ${imageInput}`);
      // upload file 
      let formData = new FormData();
      formData.append("file", imageInput );
      console.log(`==> formData:`, formData);

      // upload file into api 
      const fetchingUploadFile = async() =>{
        const response = await fetch(`https://api.escuelajs.co/api/v1/files/upload`,{
          // method, requestBody, header
          method: 'POST',
          // headers: {
          //   'content-type': 'multipart/form-data',
          //  'authorization': token....
          // },
          body: formData
        })

        const rs = await response.json();
        // console.log(`==> Result of UPload: `, rs)
        return rs;//location, filename, originalFile...
      }
      const locationReponse = await fetchingUploadFile();

      // mock create product data 
      const createProductRequest = {
        title: titleInput,
        description: descriptionInput,
        price: parseFloat(priceInput),
        category: categoryInput,
        image: locationReponse.location
      }

      if(locationReponse != null){
        //  create product into api 
        const createProduct = await fetch('https://fakestoreapi.com/products',{
          method: 'POST',
          body: JSON.stringify(createProductRequest)
        })
        const productResponse = await createProduct.json();
        console.log(`==> Create Product Response: `, productResponse)
      }else{
        return null;
      }


    })
  </script>

</body>
</html>
