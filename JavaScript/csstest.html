<!DOCTYPE html>
<html>
<head>
<style>
ul.a {list-style-type: circle;}
ul.b {list-style-type: disc;}
ul.c {list-style-type: square;}

ol.d {list-style-type: upper-roman;}
ol.e {list-style-type: lower-roman;}
ol.f {list-style-type: lower-alpha;}
ol.g {list-style-type: decimal;}
</style>




<style>
    table,
    th,
    td {
        border: 1.5px solid blue;
    }
</style>




<style>
    table.two {
        width: 80px; border-collapse: separate;
        border-spacing: 10px;
        table-layout: fixed;
    }
    table,
    td,
    th {
        border: 1.5px solid blue;
        width: 80px;
    }
</style>


</head>
<body>
    <table class="two">
        <tr>
            <th>Roll Number</th>
            <th>Name</th>
        </tr>
        <tr>
            <td>1</td>
            <td>A_B_C_D_E_F_G_H_I_J_K_L_M_N_O_P</td>
        </tr>
        <tr>
            <td>2</td>
            <td>X_Y_Z</td>
        </tr>
    </table>
</body>
</html>
